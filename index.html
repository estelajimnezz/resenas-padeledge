<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap');
    
    body {
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: transparent;
      overflow: hidden;
    }

    .slider-container {
      position: relative;
      width: 100%;
      max-width: 750px;
      background: #0A0A0A;
      padding: 30px 60px;
      border-radius: 20px;
      box-sizing: border-box;
      text-align: center;
    }

    .slider-content {
      display: flex;
      width: 100%;
      align-items: center;
    }

    .slide {
      min-width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.5s;
    }

    .slide.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .autor {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      color: #F2F5DF;
      margin: 0 0 2px 0;
      width: 100%;
    }

    .estrellas {
      font-size: 2rem;
      color: #D0F13C;
      margin: 0 0 4px 0;
      width: 100%;
    }

    .plataforma {
      font-family: 'Poppins', sans-serif;
      font-weight: 300;
      font-size: 0.7rem;
      color: #D0F13C;
      margin: 0 0 10px 0;
      letter-spacing: 0.5px;
      width: 100%;
    }

    .texto {
      font-family: 'Poppins', sans-serif;
      font-weight: 380;
      font-size: 1rem;
      color: #F2F5DF;
      line-height: 1.5;
      margin: 0;
      width: 90%;
    }

    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: #a1be3f;
      border: none;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 50%;
      transition: background 0.3s ease;
      padding: 0;
      z-index: 10;
    }

    .slider-btn:hover {
      background: #D0F13C;
    }

    .slider-btn svg {
      width: 22px;
      height: 22px;
    }

    .prev-btn { left: 10px; }
    .next-btn { right: 10px; }
  </style>
</head>
<body>

<div class="slider-container" id="main-container">
  <button id="prevBtn" class="slider-btn prev-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  
  <div class="slider-content" id="slides-wrapper">
    <div style="color: #F2F5DF; font-family: 'Poppins', sans-serif; text-align: center; width: 100%;">Cargando reseñas...</div>
  </div>

  <button id="nextBtn" class="slider-btn next-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>
</div>

<script>
  let currentSlide = 0;
  
  function avisarAltura() {
    const contenedor = document.getElementById('main-container');
    if(contenedor) {
      const altura = contenedor.offsetHeight + 20;
      window.parent.postMessage({ tipo: 'redimensionar', altura: altura }, '*');
    }
  }
  
  function showSlide(index) {
    const slides = document.querySelectorAll('.slide');
    if (slides.length === 0) return;
    if (index >= slides.length) currentSlide = 0;
    if (index < 0) currentSlide = slides.length - 1;
    
    slides.forEach(slide => slide.classList.remove('active'));
    slides[currentSlide].classList.add('active');
    
    setTimeout(avisarAltura, 50);
  }

  document.getElementById('prevBtn').addEventListener('click', () => {
    currentSlide -= 1;
    showSlide(currentSlide);
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    currentSlide += 1;
    showSlide(currentSlide);
  });

  async function cargarResenas() {
    const urlJSON = 'resenas-padeledge.json?v=' + new Date().getTime();
    const contenedor = document.getElementById('slides-wrapper');
    
    try {
      const respuesta = await fetch(urlJSON);
      const resenas = await respuesta.json();
      
      contenedor.innerHTML = '';
      
      resenas.forEach((resena, index) => {
        const slide = document.createElement('div');
        slide.className = index === 0 ? 'slide active' : 'slide';
        
        slide.innerHTML = `
          <div class="autor">${resena.autor}</div>
          <div class="estrellas">${resena.estrellas}</div>
          <div class="plataforma">${resena.plataforma}</div>
          <div class="texto">${resena.texto}</div>
        `;
        
        contenedor.appendChild(slide);
      });
      
      currentSlide = 0;
      setTimeout(avisarAltura, 100);
      
    } catch (error) {
      contenedor.innerHTML = '<div style="color: #F2F5DF; font-family: Poppins; width: 100%; text-align: center;">Error al cargar.</div>';
      setTimeout(avisarAltura, 100);
    }
  }

  cargarResenas();
  window.addEventListener('resize', avisarAltura);
</script>
</body>
</html>
